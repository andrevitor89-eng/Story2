# Story2 — producao (API + worker + frontend estatico)
# Render: New -> Blueprint -> este repo

databases:
  - name: story2-db
    plan: free
    databaseName: story2
    user: story2

services:
  - type: web
    name: story2-api
    runtime: docker
    rootDir: .
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: story2-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_BACKEND
        value: db
      - key: OFFLINE_FALLBACK
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_SSL_VERIFY
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-image
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-2.0-flash-preview-image-generation
      - key: GEMINI_MAX_RETRIES
        value: "6"
      - key: GEMINI_RETRY_BASE_SECONDS
        value: "5"
